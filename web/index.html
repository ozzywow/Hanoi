<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta property="og:title" content="Tower of Hanoi - Speedrun | Play on Web">
  <meta property="og:description" content="Race the clock in your browser, then take on the world rankings in the app.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ozzywow.github.io/Hanoi/play/">
  <meta property="og:image" content="https://ozzywow.github.io/Hanoi/shots/main.jpg">
  <title>Tower of Hanoi - Speedrun | Play on Web</title>
  <meta name="description" content="Try Tower of Hanoi - Speedrun in your browser. Race the clock, then take on the world rankings in the app.">
  <meta name="theme-color" content="#0a0a26">
  <link rel="canonical" href="https://ozzywow.github.io/Hanoi/play/">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a26; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    /* 기본은 최대 1280×853(3:2)로 제한 — 앱 리소스가 480×320 이라 더 키우면 흐려진다. 전체화면 버튼으로 크게 보기 가능 */
    canvas {
      display: block; aspect-ratio: 3 / 2;
      width: min(100vw, calc(100vh * 1.5), 1280px);
      width: min(100vw, calc(100dvh * 1.5), 1280px);
      touch-action: none; user-select: none; -webkit-user-select: none; outline: none;
      box-shadow: 0 0 0 1px #1b2a5a, 0 0 48px rgba(60, 120, 255, .16);
    }
    :fullscreen canvas { width: min(100vw, calc(100vh * 1.5)); box-shadow: none; }
    :-webkit-full-screen canvas { width: min(100vw, calc(100vh * 1.5)); box-shadow: none; }
    #fs {
      position: fixed; right: 14px; top: 14px; z-index: 5; display: none; align-items: center; gap: 8px;
      height: 38px; padding: 0 14px 0 11px; border-radius: 10px; cursor: pointer;
      border: 1.5px solid #50dcb4; background: rgba(10, 15, 50, .9); color: #50dcb4;
      font: 700 12px/1 sans-serif; letter-spacing: .8px;
      box-shadow: 0 0 14px rgba(80, 220, 180, .35), 0 2px 10px rgba(0, 0, 0, .5);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    #fs svg { width: 18px; height: 18px; flex: none; }
    #privacy { position: fixed; left: 12px; bottom: 8px; z-index: 5; color: rgba(152, 166, 190, .75); font: 11px/1 sans-serif; text-decoration: none; }
    #privacy:hover { color: #50dcb4; text-decoration: underline; }
    #fs:hover { transform: translateY(-1px); background: rgba(20, 40, 80, .95); box-shadow: 0 0 20px rgba(80, 220, 180, .6), 0 2px 12px rgba(0, 0, 0, .5); }
    #fs:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    @media (max-width: 560px) { #fs span { display: none; } #fs { padding: 0 10px; } }
    canvas { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #rotate { display: none; position: fixed; left: 0; right: 0; top: 10px; text-align: center; color: #9fd; font: 14px/1.4 sans-serif; pointer-events: none; text-shadow: 0 0 4px #000; }
    @media (orientation: portrait) and (max-width: 820px) { #rotate { display: block; } }
    noscript { color: #9fd; font: 16px monospace; display: block; padding: 24px; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <button id="fs" type="button" title="Fullscreen" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
    <span id="fs-label">FULLSCREEN</span>
  </button>
  <a id="privacy" href="https://ozzywow.github.io/Hanoi/privacy.html" target="_blank" rel="noopener">Privacy</a>
  <div id="rotate">&#8635; Rotate your device for the best experience</div>
  <noscript>JavaScript is required to play Tower of Hanoi - Speedrun on the web.</noscript>
  <script type="module" src="/src/main.ts"></script>
  <!-- Cloudflare Web Analytics (방문자 수): 토큰 발급 후 아래 주석을 풀고 token 교체. docs/web_port_plan.md §0
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "YOUR_TOKEN"}'></script>
  -->
</body>
</html>
